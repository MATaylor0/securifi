# Local / single-server deployment with PostgreSQL.
#   docker compose up -d
#   docker compose exec app securifi admin bootstrap --email you@example.com
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securifi
      POSTGRES_USER: securifi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securifi"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECURIFI_DATABASE_URL: postgresql://securifi:${POSTGRES_PASSWORD:-change-me}@db:5432/securifi
      SECURIFI_ENVIRONMENT: ${SECURIFI_ENVIRONMENT:-production}
      SECURIFI_ORGANISATION_NAME: ${SECURIFI_ORGANISATION_NAME:-Securifi}
    ports:
      - "8000:8000"
volumes:
  pgdata:
